name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - run: npm ci
            - run: npx biome ci .

    lint-frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - run: npm ci
            - run: npx biome ci .

    svelte-check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run check

    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DB_HOST: localhost
            DB_PORT: 5432
            DB_USER: test
            DB_PASSWORD: test
            DB_NAME: test
            JWT_SECRET: test-secret-not-for-production
            AUTH_ENABLED: "false"
            S3_ENDPOINT: http://localhost:9000
            S3_PUBLIC_ENDPOINT: http://localhost:9000
            S3_REGION: us-east-1
            S3_ACCESS_KEY_ID: test
            S3_SECRET_ACCESS_KEY: test
            S3_BUCKET: test-bucket
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - run: npm ci

            - run: npm test
              continue-on-error: true
              id: run_tests

            - name: Publish test report
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Vitest results
                  path: backend/test-results/junit.xml
                  reporter: java-junit
                  fail-on-error: true

            - name: Upload raw test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: backend/test-results/

            - name: Fail job if tests failed
              if: steps.run_tests.outcome == 'failure'
              run: exit 1

    audit:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - run: npm ci

            - name: npm audit
              run: npm audit --audit-level=high

            - name: OSV vulnerability scan
              uses: google/osv-scanner-action@v2
              with:
                  scan-args: |-
                      --lockfile=backend/package-lock.json
